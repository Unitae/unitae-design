name: Release

# Publishes @unitae/tokens when a tag such as `tokens-v0.1.0` is pushed.
# Uses npm trusted publishing (OIDC): no npm token is stored in this repository.
# On npmjs.com, the package's trusted publisher must point at this repository and this workflow file.
on:
  push:
    tags: ["tokens-v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Use an npm CLI that supports trusted publishing
        run: npm install -g npm@^11.5.1
      - run: pnpm install --frozen-lockfile
      - name: Check the tag matches the package version
        run: test "tokens-v$(node -p "require('./tokens/package.json').version")" = "$GITHUB_REF_NAME"
      - run: pnpm --filter @unitae/tokens test
      - run: pnpm --filter @unitae/tokens build
      - name: Publish
        run: npm publish --access public
        working-directory: tokens
