name: Release

# Publishes a package when its tag is pushed: `tokens-v0.1.0` → @unitae/tokens, `ui-v0.1.0` → @unitae/ui.
# Uses npm trusted publishing (OIDC): no npm token is stored in this repository.
# On npmjs.com, each package's trusted publisher must point at this repository and this workflow file.
on:
  push:
    tags: ["tokens-v*", "ui-v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Use an npm CLI that supports trusted publishing
        run: npm install -g npm@^11.5.1
      - run: pnpm install --frozen-lockfile
      - name: Resolve the package from the tag
        run: echo "PACKAGE_DIR=${GITHUB_REF_NAME%%-v*}" >> "$GITHUB_ENV"
      - name: Check the tag matches the package version
        run: test "$PACKAGE_DIR-v$(node -p "require('./$PACKAGE_DIR/package.json').version")" = "$GITHUB_REF_NAME"
      - run: pnpm --filter "./$PACKAGE_DIR" test
      - run: pnpm --filter "./$PACKAGE_DIR" build
      - name: Publish
        run: npm publish --access public
        working-directory: ${{ env.PACKAGE_DIR }}
